name = "glowara-usage"
main = "worker.js"
compatibility_date = "2024-11-01"

# بعد أن تنشئي قاعدة D1 (الخطوة 3 في README_AR.md) الصقي معرّفها هنا.
# المعرّف ليس سرًّا. أما ADMIN_TOKEN فيُضبط كسرّ عبر: wrangler secret put ADMIN_TOKEN
[[d1_databases]]
binding = "DB"
database_name = "glowara-usage"
database_id = "PUT_YOUR_D1_DATABASE_ID_HERE"
