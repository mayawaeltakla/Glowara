name: Deploy Glowara Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Create web scaffolding only when missing
        run: |
          set -euo pipefail

          if [ -d web ]; then
            echo "web/ already exists; leaving it untouched."
            exit 0
          fi

          scaffold="$(mktemp -d)"
          flutter create --no-pub --project-name glowara --org com.glowara --platforms=web "$scaffold"
          cp -R "$scaffold/web" .
          if [ ! -f .metadata ]; then
            cp "$scaffold/.metadata" .
          fi
          rm -rf "$scaffold"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web release
        run: flutter build web --release --base-href "/Glowara/"

      - name: Verify web build output
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -f build/web/main.dart.js
          grep -Fq '<base href="/Glowara/">' build/web/index.html
          grep -Fq 'flutter_bootstrap.js' build/web/index.html
          echo "Verified build/web/index.html and the /Glowara/ base path."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish deployment URL
        run: |
          echo "Glowara Pages URL: ${{ steps.deployment.outputs.page_url }}"
          {
            echo "### Glowara web deployment"
            echo ""
            echo "URL: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
