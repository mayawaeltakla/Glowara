name: Apply minimal Glowara fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply fixes and commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply minimal source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path


          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'patched {path}')


          def drop_line_after(path: str, anchor: str, must_contain: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              index = text.find(anchor)
              if index < 0:
                  raise SystemExit(f'Anchor not found in {path}: {anchor[:120]!r}')
              start = index + len(anchor)
              end = text.find('\n', start)
              line = text[start:end]
              if must_contain not in line:
                  raise SystemExit(f'Unexpected line in {path}: {line!r}')
              p.write_text(text[:start] + text[end + 1:], encoding='utf-8')
              print(f'removed duplicate line in {path}')


          replace(
              'lib/core/state/app_state.dart',
              "  /// تُستدعى بعد أي تعديل في البيانات لإعادة بناء الشاشات المعتمدة.\n"
              "  void refresh() => notifyListeners();\n"
              "}",
              "  /// تُستدعى بعد أي تعديل في البيانات لإعادة بناء الشاشات المعتمدة.\n"
              "  void refresh() => notifyListeners();\n\n"
              "  /// الوصول إلى الحالة المشتركة من شجرة الواجهة.\n"
              "  static AppState of(BuildContext context) => AppStateProvider.of(context);\n"
              "}",
          )

          replace(
              'lib/core/localization/app_localizations.dart',
              'final strings = await _loadStrings(locale.languageCode);',
              'final strings = await AppLocalizations._loadStrings(locale.languageCode);',
          )

          drop_line_after(
              'lib/core/localization/extra_strings.dart',
              "    'noQuranYet': 'لم تبدأي القراءة بعد',\n",
              "'careToday':",
          )
          drop_line_after(
              'lib/core/localization/extra_strings.dart',
              "    'noQuranYet': 'You have not started reading yet',\n",
              "'careToday':",
          )

          replace(
              'lib/core/security/privacy_service.dart',
              "var bytes = utf8.encode('$salt:$pin');",
              "List<int> bytes = utf8.encode('$salt:$pin');",
          )

          replace(
              'lib/core/theme/app_theme.dart',
              'final c = palette(paletteId).colors(brightness);',
              "final p = palette(paletteId);\n"
              "    final c = brightness == Brightness.light ? p.light : p.dark;",
          )

          replace(
              'lib/features/worship/quran_service.dart',
              'const QuranResult._({required this.ok, required this.data, this.error});',
              'const QuranResult._({required this.ok, this.data, this.error});',
          )

          replace(
              'lib/features/language/language_screen.dart',
              'onPressed: () => _deleteDeck(deck),',
              'onPressed: () => _deleteDeck(deck!),',
          )
          replace(
              'lib/features/language/language_screen.dart',
              'onPressed: _cards.length < 2 ? null : () => _openQuiz(deck.id),',
              'onPressed: _cards.length < 2 ? null : () => _openQuiz(deck!.id),',
          )

          replace(
              'test/core_test.dart',
              "import 'package:glowara/core/models/feature_models.dart';\n"
              "import 'package:glowara/core/utils/date_utils.dart';",
              "import 'package:glowara/core/models/feature_models.dart';\n"
              "import 'package:glowara/core/repositories/settings_repository.dart';\n"
              "import 'package:glowara/core/utils/date_utils.dart';",
          )

          replace(
              'pubspec.yaml',
              'flutter:\n  uses-material-design: true',
              'flutter:\n  generate: true\n  uses-material-design: true',
          )
          PY

      - name: Show diff
        run: |
          git diff --stat
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/state/app_state.dart \
            lib/core/localization/app_localizations.dart \
            lib/core/localization/extra_strings.dart \
            lib/core/security/privacy_service.dart \
            lib/core/theme/app_theme.dart \
            lib/features/worship/quran_service.dart \
            lib/features/language/language_screen.dart \
            test/core_test.dart \
            pubspec.yaml
          if git diff --cached --quiet; then
            echo "No source changes were produced." >&2
            exit 1
          fi
          git commit -m "Fix analyzer, test, and localization build errors"
          git push origin HEAD:main
