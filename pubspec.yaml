name: glowara
description: "Glowara — a calm, offline-first space for worship, planning, study, self-care and growth."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # intl يُستخدم عبر flutter_localizations (تُقفل الإصدارات تلقائيًا).
  intl: any
  # قاعدة البيانات المحلية: sembast (ملف على Android، IndexedDB على الويب)
  sembast: ^3.7.0
  sembast_web: ^2.3.0
  path_provider: ^2.1.3
  path: ^1.9.0
  # تُستخدم فقط لترحيل البيانات القديمة (لا تُستخدم لتخزين السجلات).
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  http: ^1.2.2
  go_router: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # الخطوط غير مضمنة عمدًا: يستخدم التطبيق خطوط النظام العربية المريحة
  # مع اللاتينية المنسقة. راجع docs/CONTENT_SOURCES.md لإضافة Amiri/Tajawal.
